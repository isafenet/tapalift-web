<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!-- Watch me home by a link (Jay, 18 Oct 2026; docs/sync-protocol.md section 17). No tracking, no third-party scripts:
     this page, its script, and the sealed update from Tapalift's service, opened here with the key after the #. The
     street map behind the line is only fetched (from OpenStreetMap) if the viewer asks for it. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://tapalift-relay.isafenet-feedback.workers.dev; img-src 'self' data: https://tile.openstreetmap.org; base-uri 'none'; form-action 'none'">
<title>Watch me home · Tapalift</title>
<style>
  :root { --yellow: #FFC21A; --ink: #12161C; --blue: #1F6FEB; --ground: #FFFDF6; --card: #FFFFFF; --soft: #5A606B; --line: #E7E2D3; --late: #B4441B; }
  @media (prefers-color-scheme: dark) { :root { --ground: #12161C; --card: #1C2129; --ink: #F3F2EE; --soft: #B9BDC6; --line: #2C323C; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; margin-bottom: 18px; }
  .brand i { width: 28px; height: 28px; border-radius: 9px; background: var(--yellow); display: inline-block; border: 2px solid #12161C; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; }
  h1 { font-size: 24px; line-height: 1.2; margin: 0 0 6px; }
  .line { color: var(--soft); margin: 0; }
  .late h1 { color: var(--late); }
  .map { position: relative; height: 320px; margin-top: 16px; border-radius: 18px; overflow: hidden; background: #EEF1EC; border: 1px solid var(--line); }
  .map .tiles { position: absolute; inset: 0; }
  .map .tiles img { position: absolute; width: 256px; height: 256px; }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .buttons a, .buttons button { flex: 1 1 140px; min-height: 48px; border-radius: 14px; border: 2px solid #12161C; background: var(--yellow);
    color: #12161C; font: inherit; font-weight: 700; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; padding: 0 14px; }
  .buttons .quiet { background: var(--card); color: var(--ink); border-color: var(--line); }
  .small { color: var(--soft); font-size: 14px; margin-top: 18px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="brand"><i aria-hidden="true"></i>Tapalift</div>
  <section class="card" id="card" aria-live="polite">
    <h1 id="title">Opening…</h1>
    <p class="line" id="line">Getting where they are.</p>
    <div class="map" id="map" hidden>
      <div class="tiles" id="tiles"></div>
      <svg id="trail" aria-label="Where they've been, with where they are now as a dot" role="img"></svg>
    </div>
    <div class="buttons" id="buttons" hidden>
      <a id="apple" href="#">Apple Maps</a>
      <a id="google" class="quiet" href="#">Google Maps</a>
      <button id="street" class="quiet" type="button">Show the street map</button>
    </div>
  </section>
  <p class="small" id="about">This link shows where someone is on the way home, until they're there or for two hours at most. Only people with the link can open it: what Tapalift's service holds is sealed, and the key is in the link itself. It stops by itself.</p>
</main>
<script type="module" src="watch.js"></script>
</body>
</html>
